<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">axxcalender — Ruang kecil untuk hari-hari besar</title>
<desc id="desc">Header animasi axxcalender dengan ular yang melihat sekeliling sambil memakan apel, gaya editorial premium</desc>
<rect width="1200" height="420" rx="28" fill="#f8f9f5"/>
<!-- subtle grid -->
<g opacity="0.04" stroke="#283e35" stroke-width="1"><path d="M80 80h1040"/><path d="M80 340h1040"/></g>
<!-- brand -->
<g font-family="'DM Sans',system-ui,sans-serif" fill="#283e35">
  <g transform="translate(72 62)">
    <rect x="0" y="0" width="22" height="22" rx="6" fill="#48694f"/>
    <rect x="26" y="0" width="22" height="22" rx="6" fill="#48694f"/>
    <rect x="0" y="26" width="22" height="22" rx="6" fill="#48694f"/>
    <rect x="26" y="26" width="22" height="22" rx="10 10 6 6" fill="#48694f"/>
  </g>
  <text x="130" y="78" font-size="28" font-weight="800" letter-spacing="-1.1">axxcalender.</text>
  <text x="130" y="96" font-size="10" letter-spacing="1.6" fill="#8b9189">RUANG KECIL UNTUK HARI-HARI BESAR</text>
</g>
<!-- hero left -->
<g font-family="'DM Sans',system-ui,sans-serif">
  <text x="72" y="165" font-size="11" letter-spacing="1.8" fill="#8b9189">✳  RUANG KECIL UNTUK HARI-HARI BESAR</text>
  <text x="72" y="220" font-size="56" font-weight="500" letter-spacing="-2.5" fill="#1e3a2d">Hari-hari baik,</text>
  <text x="72" y="275" font-size="56" font-weight="400" font-style="italic" fill="#48694f" font-family="'DM Serif Display',serif">dimulai di sini.</text>
  <text x="72" y="310" font-size="13" fill="#8b9189">Atur waktumu. Temukan ritmemu. Nikmati setiap hari.</text>
  <!-- pill -->
  <g transform="translate(72 335)">
    <rect width="210" height="32" rx="16" fill="#ffffff" stroke="#e7eae2"/>
    <circle id="live-dot" cx="16" cy="16" r="3" fill="#48694f"/>
    <text x="28" y="20" font-size="11" fill="#283e35">Live — Selasa, 13 Oktober 2026</text>
  </g>
</g>
<!-- snake loader animation on right, larger -->
<g transform="translate(690 70)">
  <rect x="0" y="0" width="440" height="280" rx="20" fill="#ffffff" stroke="#e7eae2"/>
  <g transform="translate(20 20)">
    <!-- shadow -->
    <ellipse cx="196" cy="210" rx="140" ry="10" fill="#283e35" opacity="0.06"/>
    <!-- tail -->
    <path id="snake-tail" d="M32 155 C15 90 59 96 58 153 S108 179 110 130 S152 95 158 134" fill="none" stroke="#466b52" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
    <!-- apple -->
    <g id="apple">
      <path d="M287 131C257 105 255 144 279 163Q286 167 294 162C319 140 314 106 287 131Z" fill="#d97760"/>
      <path d="M287 132q-3-13 4-18" stroke="#73543c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M289 123q3-12 14-8-2 10-14 8" fill="#739866"/>
    </g>
    <!-- head -->
    <g id="snake-head">
      <ellipse cx="242" cy="124" rx="23" ry="21" fill="#466b52"/>
      <ellipse cx="248" cy="116" rx="6" ry="8" fill="#fff"/>
      <circle id="snake-eye" cx="250" cy="117" r="3" fill="#172b22"/>
      <path d="M253 132 Q262 134 265 126" stroke="#183e2a" fill="none" stroke-width="2" stroke-linecap="round"/>
      <path id="tongue" d="M265 129h12m-3-3 3 3-3 3" stroke="#d56e65" fill="none" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
  <!-- clock hint -->
  <g transform="translate(28 220)" font-family="'DM Sans',monospace" fill="#48694f">
    <text x="0" y="0" font-size="11" letter-spacing="1.2" fill="#8b9189">SAAT INI • WIB • Live</text>
    <text x="0" y="38" font-size="42" font-weight="700" letter-spacing="-2">18:56:24</text>
    <text x="190" y="38" font-size="12" fill="#8b9189">WIB Jakarta</text>
  </g>
  <!-- decorative spark -->
  <g transform="translate(390 40)" opacity="0.25" stroke="#466b52" stroke-width="1.2">
    <g id="spark"><path d="M20 0v40M0 20h40M6 6l28 28M6 34l28-28"/></g>
  </g>
</g>
<style>
  #snake-head { transform-origin: 242px 124px; animation: snake-look 1.6s ease-in-out infinite; }
  #snake-eye { animation: snake-eye 1.6s ease-in-out infinite; }
  #snake-tail { animation: tail-wiggle 1.6s ease-in-out infinite; transform-origin: 140px 140px; }
  #apple { animation: apple-eat 1.6s ease-in-out infinite; transform-origin: 287px 140px; }
  #tongue { animation: tongue 1.6s ease-in-out infinite; }
  #live-dot { animation: live-pulse 1.6s ease-in-out infinite; }
  #spark { transform-origin: 20px 20px; animation: spark-rotate 18s linear infinite; }
  @keyframes snake-look { 0%,100%{transform:rotate(-7deg)} 30%{transform:rotate(8deg)} 65%{transform:translateX(10px) rotate(0deg)} }
  @keyframes snake-eye { 0%,100%{transform:translateX(-2px)} 30%,65%{transform:translateX(1px)} }
  @keyframes tail-wiggle { 50%{transform:scaleX(0.94)} }
  @keyframes apple-eat { 0%,35%,100%{transform:scale(1);opacity:1} 65%,85%{transform:translateX(-16px) scale(0.12);opacity:0} }
  @keyframes tongue { 0%,45%,100%{opacity:0} 60%{opacity:1} }
  @keyframes live-pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  @keyframes spark-rotate { to{transform:rotate(360deg)} }
  @media (prefers-reduced-motion: reduce) { #snake-head,#snake-eye,#snake-tail,#apple,#tongue,#live-dot,#spark{animation:none!important} }
</style>
</svg>
